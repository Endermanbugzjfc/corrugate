[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corrugate"
version = "0.1.0"
description = "A persistent visual whiteboard beside Codex in Kitty"
requires-python = ">=3.11"
dependencies = ["textual>=1", "textual-image>=0.8", "Pillow>=10", "CairoSVG>=2.7", "defusedxml>=0.7"]

[project.scripts]
corrugate = "corrugate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
